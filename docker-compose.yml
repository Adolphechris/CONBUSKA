version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: conbusca_postgres
    restart: always
    environment:
      POSTGRES_DB: conbusca_db
      POSTGRES_USER: conbusca_user
      POSTGRES_PASSWORD: conbusca_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: conbusca_redis
    restart: always
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: conbusca_django_web
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-conbusca-local-dev-key
      - DB_NAME=conbusca_db
      - DB_USER=conbusca_user
      - DB_PASSWORD=conbusca_password
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/1
      - ALLOWED_HOSTS=*
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
