server {
    listen 80;
    server_name esm.conbuska.cd api.conbuska.cd;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name esm.conbuska.cd api.conbuska.cd;

    # SSL (Let's Encrypt via certbot)
    ssl_certificate /etc/letsencrypt/live/esm.conbuska.cd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/esm.conbuska.cd/privkey.pem;
    include /etc/letsencrypt/options-ssl-detailed.conf;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Static & Media
    location /static/ {
        alias /var/www/esm/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /var/www/esm/media/;
        expires 7d;
    }

    # Django app via Gunicorn
    location / {
        proxy_pass http://unix:/run/gunicorn-esm.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Health check (bypass cache)
    location /health/ {
        proxy_pass http://unix:/run/gunicorn-esm.sock;
        proxy_set_header Host $host;
        access_log off;
    }
}
