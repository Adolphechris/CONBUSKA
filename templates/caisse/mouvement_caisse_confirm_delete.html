<div class="modal-header">
    <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">×</span></button>
    <h4 class="modal-title"><i class="fa fa-trash"></i> {{ title }}</h4>
</div>
<form
      hx-delete="{% url 'delete_mouvement_caisse' caisse.pk mouvement_caisse.pk %}"
      hx-target="#mouvements-table"
      hx-swap="innerHTML">
    <div class="modal-body">
        {% csrf_token %}
        <div class="alert alert-warning">
            <i class="fa fa-warning"></i> {{ message }} {{ mouvement_caisse.pk }} {{ mouvement_caisse.fournisseur.nom }}
        </div>
        <p></p>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal">Annuler</button>
        <button type="submit" class="btn btn-success">
            <i class="{{ submit_icon }}"></i> {{ submit_label }}
        </button>
    </div>
</form>
