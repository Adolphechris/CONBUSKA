    <label class="control-label col-md-12 col-sm-12 col-xs-12">Fournisseur</label>
    <div class="col-md-12 col-sm-12 col-xs-12">
        <select name="fournisseur" class="form-control">
            {% for fournisseur in fournisseurs %}

            {% endfor %}
        </select>
    </div>
</div>
