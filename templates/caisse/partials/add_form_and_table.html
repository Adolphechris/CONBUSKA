{% if error_message %}
<div class="alert alert-danger" role="alert">
    <i class="fa fa-exclamation-triangle"></i> {{ error_message }}
</div>
{% endif %}
<div id="formTableContainer">
    <!-- Formulaire à gauche -->
    <div class="col-md-4" id="formContainer">
        <div id="addFormContainer">
            {% include "caisse/partials/add_form.html" %}
        </div>
        <div id="updateFormContainer"></div>
    </div>

    <!-- Tableau à droite -->
    <div class="col-md-8">
        <div class="content" id="mouvements-table">
            {% include "caisse/partials/lines_table.html" %}
        </div>
    </div>
</div>

<div class="x_content" id="caisse-totaux" hx-swap-oob="true">
    <div class="row">
        <div class="col-sm-4 col-xs-6">
            <div class="well well-sm text-center">
                <h4 class="text-muted">Solde actuel</h4>
                <h2 class="text-success"><strong>{{ solde_caisse }} FC</strong></h2>
            </div>
        </div>
        <div class="col-sm-4 col-xs-6">
            <div class="well well-sm text-center">
                <h4 class="text-muted">Total entrées</h4>
                <h2 class="text-info"><strong>{{ total_entrees }} FC</strong></h2>
            </div>
        </div>
        <div class="col-sm-4 col-xs-6">
            <div class="well well-sm text-center">
                <h4 class="text-muted">Total sorties</h4>
                <h2 class="text-danger"><strong>{{ total_sorties }} FC</strong></h2>
            </div>
        </div>
    </div>
</div>
