<div class="form-group">
    <label class="control-label col-md-3 col-sm-3 col-xs-12">Creancier</label>
    <div class="col-md-9 col-sm-9 col-xs-12">
        <select name="creancier" class="form-control">
            {% for creancier in creanciers %}
                <option value="{{ creancier.pk }}">{{ creancier.nom }}</option>
            {% endfor %}
        </select>
    </div>
</div>
