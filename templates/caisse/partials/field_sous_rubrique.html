<div class="form-group">
    <label class="control-label col-md-3 col-sm-3 col-xs-12">Sous rubrique</label>
    <div class="col-md-9 col-sm-9 col-xs-12">
        <select name="sous_rubrique" class="form-control" id="id_sous_rubrique">
            {% for sous_rubrique in sous_rubriques %}
                <option value="{{ sous_rubrique.pk }}">{{ sous_rubrique.nom }}</option>0
            {% endfor %}
        </select>
    </div>
</div>
