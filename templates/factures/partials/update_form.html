<form class="form-premium" id="updateForm"
      method="POST"
      hx-post="{% url 'facture_details' facture_pk %}"
      hx-target="#formTableContainer"
      hx-swap="innerHTML"
      hx-on="htmx:afterRequest: resetForms()">

    {% csrf_token %}
    <input type="hidden" name="form_type" value="update">
    <input type="hidden" name="id" value="{{ detail_facture_pk  }}">

    <div class="form-group-premium">
        {{ update_form.article }}
    </div>
    <div class="form-group-premium">
        <div class="quantity-input">
            <button type="button" class="qty-btn qty-minus">
                <i class="fa fa-minus"></i>
            </button>
            {{ update_form.qte }}
            <button type="button" class="qty-btn qty-plus">
                <i class="fa fa-plus"></i>
            </button>
        </div>
    </div>
    <div class="form-actions">
        <button type="submit" class="btn btn-success-premium btn-block">
            <i class="fa fa-plus-circle"></i>
            <span>Mettre à jour</span>
        </button>
        <button type="button" class="btn btn-secondary btn-block"
            onclick="document.getElementById('updateFormContainer').innerHTML = ''; document.getElementById('addFormContainer').style.display = 'block';">
            <i class="fa fa-times icon-space"></i> Annuler
        </button>
    </div>
</form>
