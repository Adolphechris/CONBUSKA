<div class="card-premium info-card">
    <div class="card-header">
        <div class="card-title">
            <i class="fa fa-info-circle"></i>
            <span>Informations facture</span>
        </div>
        <div class="card-status">
            <div class="status-dot status-pending"></div>
        </div>
    </div>
    <div class="card-content">
        <form method="POST"
              action="{% url 'facture_infos_update' facture.pk %}"
              hx-post="{% url 'facture_infos_update' facture.pk %}"
              hx-trigger="change delay:500ms"
              hx-swap="none"
              hx-on="submit: event.preventDefault()"
              class="form-premium"
              id="infoForm"
        >
            {% csrf_token %}
            <div class="form-group-premium">
                <div class="input-premium disabled">
                    <div class="input-icon">
                        <i class="fa fa-truck"></i>
                    </div>
                    <input type="text" class="form-control" value="{{ facture.livreur.nom|default:'—' }}" readonly>
                    <div class="input-badge">Auto</div>
                </div>
            </div>
            <div class="form-group-premium">
                <div class="input-premium">
                    <div class="input-icon">
                        <i class="fa fa-user"></i>
                    </div>
                    {{ info_form.client_comptoir }}
                    <button hx-get="{% url 'create_facture_client' facture.pk %}"
                            hx-target="#modal-client"
                            hx-trigger="click"
                            hx-swap="innerHTML"
                            data-bs-toggle="modal"
                            data-bs-target="#modalSearchClient"
                            title="Rechercher client"
                            class="input-action">
                        <i class="fa fa-search"></i>
                    </button>
                </div>
            </div>
            <div class="form-actions">
                <input type="submit" class="btn btn-primary-premium btn-block valider" value="Valider les informations" disabled id="validateInfo">
                <div id="save-feedback" class="text-success mt-2" style="display:none;">Infos sauvegardées</div>
            </div>
        </form>
    </div>
</div>

<script>
    const form = document.getElementById('infoForm');
    const saveBtn = document.getElementById('validateInfo');
    const feedback = document.getElementById('save-feedback');
    let initialData = new FormData(form);
    let formChanged = false;

    // Active le bouton si un champ change
    form.addEventListener('input', () => {
        formChanged = true;
        saveBtn.disabled = false;
    });

    // Gère le retour HTMX après la sauvegarde
    document.body.addEventListener('htmx:afterRequest', function (e) {
        if (formChanged) {
            saveBtn.disabled = true;
            feedback.style.display = 'block';
            formChanged = false;

            // Cache le message après 2 secondes
            setTimeout(() => {
                feedback.style.display = 'none';
            }, 2000);
        }
    });
</script>
