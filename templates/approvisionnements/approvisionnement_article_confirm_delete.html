<div class="modal-header">
    <button type="button" class="btn-close pull-right" data-dismiss="modal" aria-label="Close">x</button>
    <h5 class="modal-title">{{ title }}</h5>
</div>
<form method="POST"
      hx-delete="{% url 'delete_article_approvisionnement' approvisionnement.pk object.pk %}"
      hx-target="this"
      hx-swap="none">
    <div class="modal-body">
        {% csrf_token %}
        <p>{{ message }}</p>
    </div>
    <div class="modal-footer">
        <button type="submit" class="btn btn-success">
            <i class="{{ submit_icon }}"></i> {{ submit_label }}
        </button>
        <button type="button" class="btn btn-danger" data-dismiss="modal">
            <i class="fa fa-times"></i> Annuler
        </button>
    </div>
</form>
