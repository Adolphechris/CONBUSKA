<div class="add-form-container">
    <h6 class="form-title">Modifier un article</h6>
    <form id="updateForm"
          hx-post="{% url 'commande_line_update' commande_pk %}"
          hx-target="#linesTableContainer"
          hx-swap="innerHTML">
        {% csrf_token %}
        <input type="hidden" name="id" value="{{ detail_pk }}">

        <!-- Article verrouillé -->
        <div class="form-group">
            <div class="input-group">
                <span class="input-group-addon"><i class="fa fa-cube"></i></span>
                <input type="text" class="form-control" value="{{ article_nom }}" disabled
                       style="background:#f5f5f5; color:#888; cursor:not-allowed; border-style:dashed;">
            </div>
        </div>

        <div class="form-group{% if update_form.qte.errors %} has-error{% endif %}">
            <div class="input-group">
                <span class="input-group-addon"><i class="fa fa-sort-numeric-asc"></i></span>
                {{ update_form.qte }}
            </div>
            {% if update_form.qte.errors %}<span class="help-block text-danger">{{ update_form.qte.errors|join:", " }}</span>{% endif %}
        </div>
        <div class="form-group{% if update_form.prix.errors %} has-error{% endif %}">
            <div class="input-group">
                <span class="input-group-addon"><i class="fa fa-usd"></i>&nbsp;</span>
                {{ update_form.prix }}
            </div>
            {% if update_form.prix.errors %}<span class="help-block text-danger">{{ update_form.prix.errors|join:", " }}</span>{% endif %}
        </div>

        <button type="submit" class="btn btn-success btn-block">
            <i class="fa fa-check icon-space"></i> Mettre à jour
        </button>
        <button type="button" class="btn btn-default btn-block" id="btnCancelUpdate"
                onclick="document.getElementById('updateFormContainer').innerHTML=''; document.getElementById('addFormContainer').style.display='';">
            <i class="fa fa-times icon-space"></i> Annuler
        </button>
    </form>
</div>
