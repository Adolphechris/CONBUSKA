{% extends "base/base.html" %}
{% load static %}

{% block title %} Commande|Create {% endblock title %}

{% block content %}
    <div class="right_col" role="main">
        <div class="">
            <div class="page-title">
                <div class="title_left">
                    <h5>Commandes /{{ title }}</h5>
                </div>
            </div>
            <div class="col-md-12">
                <div class="x_panel">
                    <div class="x_title">
                        <h4>{{ title_form }}</h4>
                        <div class="clearfix"></div>
                    </div>
                    <div class="x_content">
                        <form class="form-horizontal form-label-left" enctype="multipart/form-data" action='' method="POST" novalidate>
                            {% csrf_token %}
                            {% for field in form.visible_fields  %}
                                <div class="form-group">
                                    <label class="control-label col-md-3 col-sm-3 col-xs-12">
                                        {{ field.label }}
                                    </label>
                                    <div class="col-md-6 col-sm-6 col-xs-12">
                                        {{ field }}
                                        <span style="color: red;">{{ field.errors }}</span>
                                    </div>
                                </div>
                            {% endfor %}
                            <div class="ln_solid"></div>
                            <div class="col-md-6 col-sm-6 col-xs-12 col-md-offset-3">
                                <input type="submit" class="btn btn-info valider" value="Valider">
                                <a href="{{ cancel_url }}">
                                    <button class="btn btn-danger" type="button">
                                        Annuler
                                    </button>
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            $('#id_date_commande').daterangepicker({
                singleDatePicker: true,
                locale: {
                    format: 'YYYY-MM-DD'
                }
            });

            $('#commandes').addClass('active');
         });
    </script>

{% endblock content %}
