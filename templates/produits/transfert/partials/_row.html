<tr class="main-row"
    data-toggle="collapse"
    data-target="#lots-{{ i.pk }}"
    style="cursor: pointer;">
    <td>{{ forloop.counter }}</td>
    <td>
        <i class="fa fa-chevron-right text-muted small row-arrow"></i>
        <strong>{{ i.article.designation }}</strong>
    </td>
    <td>{{ i.qte }}</td>
    <td class="text-center">
        <div class="btn-group">
            <button
                    class="btn btn-default btn-sm"
                    hx-get="{% url 'get_form_update_transfert' i.pk %}"
                    hx-target="#updateFormContainer"
                    hx-swap="innerHTML"
                    hx-trigger="click"
                    hx-on:click="document.getElementById('addFormContainer').style.display = 'none';">
                <i class="fa fa-pencil"></i>
            </button>
            <button
                class="btn btn-danger btn-sm"
                hx-get="{% url 'transfert_line_delete' transfert.pk i.pk %}"
                hx-target="#modalContent"
                hx-trigger="click"
                hx-swap="innerHTML">
                <i class="fa fa-trash-o"></i>
            </button>
        </div>
    </td>
</tr>
<tr id="lots-{{ i.pk }}" class="collapse detail-row bg-light">
    <td colspan="3" class="p-0">
        <div class="detail-container">
            <table class="table table-sm table-borderless mb-0 ml-4" style="width: auto;">
                <thead>
                    <tr class="text-uppercase text-muted" style="font-size: 0.75rem;">
                        <th class="pb-1">Date de péremption</th>
                        <th class="pb-1">Quantité réservée</th>
                    </tr>
                </thead>
                <tbody>
                    {% for lot in i.get_my_lots %}
                    <tr>
                        <td class="py-1">
                            <i class="fa fa-history text-{% if lot.is_near_expiry %}danger{% else %}muted{% endif %}"></i>
                            {{ lot.date_peremption|date:"d M Y" }}
                        </td>
                        <td class="py-1"><strong>{{ lot.qte }}</strong></td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </td>
</tr>
