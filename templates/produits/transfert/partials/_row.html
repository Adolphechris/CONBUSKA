<tr class="main-row"
    data-toggle="collapse"
    data-target="#lots-{{ i.pk }}"
    style="cursor: pointer;">
    <td>{{ forloop.counter }}</td>
    <td>
        <i class="fa fa-chevron-right text-muted small row-arrow"></i>
        <strong>{{ i.article.designation }}</strong>
    </td>
    <td>{{ i.qte }}</td>
    <td class="text-center">
        <div class="btn-group">
            <button
                    class="btn btn-default btn-sm"
                    hx-get="{% url 'get_form_update_transfert' i.pk %}"
                    hx-target="#updateFormContainer"
                    hx-swap="innerHTML"
                    hx-trigger="click"
                    hx-on:click="document.getElementById('addFormContainer').style.display = 'none';">
                <i class="fa fa-pencil"></i>
            </button>
            <button
                class="btn btn-danger btn-sm"
                hx-get="{% url 'transfert_line_delete' transfert.pk i.pk %}"
                hx-target="#modalContent"
                hx-trigger="click"
                hx-swap="innerHTML">
                <i class="fa fa-trash-o"></i>
            </button>
        </div>
    </td>
</tr>
<tr id="lots-{{ i.pk }}" class="collapse detail-row">
    <td colspan="4" style="padding:0; background:#F8FFFE; border-top:none;">
        <div style="padding:10px 16px 12px 42px; border-left:3px solid #26B99A;">

            <p style="margin:0 0 8px; font-size:10px; font-weight:700; color:#26B99A;
                       text-transform:uppercase; letter-spacing:.6px;">
                <i class="fa fa-tag"></i> Lots réservés
            </p>

            {% with lots=i.get_my_lots %}
            {% if lots %}
            <div style="display:flex; flex-wrap:wrap; gap:6px;">
                {% for lot in lots %}
                <div style="display:inline-flex; align-items:center; gap:6px;
                             background:#fff; border:1px solid #D5F5EE;
                             border-radius:6px; padding:5px 10px;
                             box-shadow:0 1px 3px rgba(38,185,154,.08);">
                    <i class="fa fa-calendar-o"
                       style="font-size:11px; color:#26B99A;"></i>
                    <span style="font-size:12px; color:#2A3F54; font-weight:500;">
                        {{ lot.date_peremption|date:"d/m/Y" }}
                    </span>
                    <span style="width:1px; height:12px; background:#E0E0E0;
                                 display:inline-block;"></span>
                    <span style="font-size:12px; font-weight:700; color:#169F85;">
                        {{ lot.qte }} u.
                    </span>
                </div>
                {% endfor %}
            </div>
            {% else %}
            <span style="font-size:12px; color:#ADB5BD; font-style:italic;">
                <i class="fa fa-info-circle"></i> Aucun lot réservé
            </span>
            {% endif %}
            {% endwith %}

        </div>
    </td>
</tr>
