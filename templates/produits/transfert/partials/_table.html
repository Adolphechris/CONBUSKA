<table id="tableTransfert" class="table table-striped bulk_action">

            <th>N°</th>
            <th>Article</th>
            <th>Qté</th>
            <th class="text-center">Action</th>
        </tr>
    </thead>
    <tbody>
        {% for i in details_transfert %}

</table>
