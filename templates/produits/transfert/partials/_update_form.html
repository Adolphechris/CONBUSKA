<div class="add-form-container">
    <p class="form-title">
        Modifier article
        <button type="button"
                class="btn btn-xs btn-default pull-right"
                onclick="
                    document.getElementById('updateFormContainer').innerHTML = '';
                    document.getElementById('addFormContainer').style.display = 'block';">
            <i class="fa fa-times"></i>
        </button>
    </p>

    {% if form.non_field_errors %}
    <ul class="errorlist">
        {% for error in form.non_field_errors %}
            <li><i class="fa fa-exclamation-circle"></i> {{ error }}</li>
        {% endfor %}
    </ul>
    {% endif %}

    <form id="updateForm"
          hx-post="{% url 'transfert_line_update' detail_transfert_pk %}"
          hx-target="#linesTableContainer"
          hx-swap="innerHTML">
        {% csrf_token %}
        <input type="hidden" name="detail_transfert_pk" value="{{ detail_transfert_pk }}">
        <div class="form-group">
            <div class="input-group">
                <span class="input-group-addon"><i class="fa fa-cube"></i></span>
                {{ form.article_display }}
            </div>
        </div>
        <div class="form-group {% if form.qte.errors %}has-error{% endif %}">
            <div class="input-group">
                <span class="input-group-addon"><i class="fa fa-sort-numeric-asc"></i></span>
                {{ form.qte }}
            </div>
            {% for error in form.qte.errors %}
                <span class="help-block">{{ error }}</span>
            {% endfor %}
        </div>
        <button type="submit" class="btn btn-warning btn-block">
            <i class="fa fa-pencil"></i> Enregistrer
        </button>
    </form>
</div>
