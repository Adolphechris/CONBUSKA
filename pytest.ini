[pytest]
DJANGO_SETTINGS_MODULE = esm.settings.dev
python_files = test_*.py tests.py
python_classes = Test*
python_functions = test_*
# --no-migrations : crée les tables directement depuis les modèles (syncdb).
# Évite les migrations de données (ex: 0001_initial SeparateDatabaseAndState)
# qui supposent une DB existante et échouent sur une DB de test vierge.
addopts = --no-migrations
